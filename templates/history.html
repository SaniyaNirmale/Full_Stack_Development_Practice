<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini calculator with history</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"
</head>
<!-- Here I used jinja , its is a template engine that let us mix python logic inside html -->
 <!-- template engine means it is a blueprint , and flask fills it with real data -->
  <!-- same template -> different data -> different output -->
<!-- Double curly braces print variables -->
<!-- Percent curly braces are for control statements like for/if -->

</head>
<body>
    <h1>Calculation history</h1>
    <table border="1">
        <!-- tr is table row -->
        <tr> 
            <!-- th is table header -->
             <!-- add ID for delete function -->
            <th>ID</th>  
            <th>A</th>
            <th>B</th>
            <th>operations</th>
            <th>result</th>
            <th>Action</th>

        </tr>
        <!-- this is loop through records2 -->

        {% for row in records2 %}
        <tr>
            <!-- <h3>{{ result }}</h3> means it take variable result from flask and print it here-->
             <!-- td is table data -->
              <!-- here row 0 is for delete function id column -->
            <td>{{row[0]}}</td> 
            <td>{{row[1]}}</td>
            <td>{{row[2]}}</td>
            <td>{{row[3]}}</td>
            <td>{{row[4]}}</td>

            <td>
                <!-- To add buttons on front page Edit and delete button -->
                 <!-- Database → Jinja → HTML → Browser → Flask Route → SQL -->
                <a href = "/edit/{{row[0]}}">Edit</a>
                <a href="{{ url_for('delete', id=row[0]) }}">Delete</a>
            </td>

        </tr>
        {% endfor %}
    </table>
    
</body>
</html>
